# Netlify configuration.
#
# The app also deploys to Vercel with zero configuration — Vercel detects Next.js
# natively and ignores this file. Security headers live in `next.config.ts` so they
# apply on every host; only genuinely Netlify-specific settings belong here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node 20.9+. Pin to 22 to match local development.
  NODE_VERSION = "22"

# The Next.js Runtime plugin is what makes App Router features work on Netlify —
# server components, route handlers under /api, and the image optimiser. Without it,
# `next build` output is a static shell and every API route 404s.
#
# On Vercel this plugin is neither needed nor used.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# NOTE ON FUNCTION TIMEOUTS
#
# Netlify's synchronous function limit is well under a minute, which can truncate the
# copilot's model call. Vercel's default is 300s on every plan (see the maxDuration
# export in app/api/copilot/chat/route.ts), so Vercel is the better host for heavy
# copilot use. Everything else in the app is fast enough for either.
